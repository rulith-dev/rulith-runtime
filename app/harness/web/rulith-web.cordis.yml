# Deep Rulith: the Rulith edition of DeepSeek Harness (dsh 0.2.1-alpha.1 web profile, base + web-app). dsh's own agent and UI stay;
# its local tools (except the read-only web tools, D-1015c), dsh-authored model text (except the repeat-tool reminder and the web tools' own text), DeepSeek account, feedback, telemetry and session uploads are off. The model is the one
# set in Rulith (any OpenAI-compatible endpoint, through the generic adapter: no DeepSeek-specific headers or identity).
# Rulith's three tools (rulith/v4), the approved persona and the Deep Rulith account entry and panel are added; dsh's web_search and web_fetch stay native.
# Paths come from the launcher's environment (start-deep-rulith.mjs); nothing secret is written here.
- id: tool-plugin-manager
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: fs-observation-policy
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: skill-badge
  disabled: true
- id: tool-skill
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-ralph
  disabled: true
- id: plan-mode
  disabled: true
- id: subagent
  disabled: false
  config:
    maxDepth: 1
    maxActiveSubagents: 4
- id: subagent-spawn-in-process
  disabled: false
- id: subagent-fork-in-process
  disabled: false
- id: tool-subagent-control
  disabled: false
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: false
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1
    enableRunInBackground: true
    backgroundMode: continuable
    # Children: Rulith's three and the registered web tools (web_search only with a search key, as tool-web below).
    toolFilter:
      allow: !!js "process.env.RULITH_DSH_WEB_SEARCH_KEY ? ['Get', 'Set', 'Execute', 'web_search', 'web_fetch'] : ['Get', 'Set', 'Execute', 'web_fetch']"
- id: tool-subagent-fork
  disabled: false
  config:
    provider: fork
    toolName: subagent_fork
    maxDepth: 1
    enableRunInBackground: true
    backgroundMode: continuable
    # Children: Rulith's three and the registered web tools (web_search only with a search key, as tool-web below).
    toolFilter:
      allow: !!js "process.env.RULITH_DSH_WEB_SEARCH_KEY ? ['Get', 'Set', 'Execute', 'web_search', 'web_fetch'] : ['Get', 'Set', 'Execute', 'web_fetch']"
- id: ptc-runtime
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
# dsh 的结果裁剪器保持关闭：Rulith 结果由板视图转录（board-transcript.mjs）安排，裁剪器会把它们截成读不懂的片段。
- id: tool-result-pruner
  disabled: true
# 自动压缩见下面 preset-rulith 的 plugins：dsh 网页版把压缩放在每个 Agent 预设里（主机层的 compaction-basic 与
# command-compact 由 dsh-web-app 关掉），所以要挂在我们的预设里才生效。
- id: image-offload
  disabled: true
# dsh's repeat-tool reminder stays on (thresholds 3, 5, 8; arguments compared key-sorted, as received): when the
# arguments that reach Rulith are the same call after call, the model is told so, which is how it learns that its own
# corrections are not arriving (2026-10-08: a parser added naf to every rule head ten times in a row).
# D-1015c（所有者 2026-10-15）：只读、无副作用的网络工具不经 Rulith，原生提供：dsh 的 web_search 与 web_fetch（tool-web，
# 以及它需要的 web、web-search-deepseek、web-fetch-http，后三者 base 本就开着）。dsh 网页版把 tool-web 关在主机层（交给预设），
# 这里重新打开。其余本地工具（read、write、edit、glob、grep、shell、作业）仍关；工具白名单见 rulith-web-gate.mjs。
# web_search 走 DeepSeek 的搜索接口，密钥只经环境变量 RULITH_DSH_WEB_SEARCH_KEY 传入：启动器只在 Rulith 的模型是 DeepSeek
# API 时设置它（web-tools.mjs webSearchKey），没有时不注册 web_search，启动照常。web_fetch 的地址检查见 web-tools.mjs。
- id: web-search-deepseek
  config:
    apiKeyEnv: RULITH_DSH_WEB_SEARCH_KEY
    # Pinned to DeepSeek (dsh's default), so the key never follows a DEEPSEEK_SEARCH_BASE_URL from a .env file.
    baseURL: https://api.deepseek.com/anthropic/v1
- id: tool-web
  disabled: false
  config:
    search: !!js '!!process.env.RULITH_DSH_WEB_SEARCH_KEY'
    fetch: true
    searchTimeoutMs: 60000
- id: mcp-resources
  disabled: true

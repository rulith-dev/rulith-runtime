  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: desktop-product-telemetry
  disabled: true
- id: product-analytics
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: deepseek-account
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: message-feedback
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: command-feedback
  disabled: true
- id: ui-settings-account
  disabled: true
- id: account-controller
  disabled: true
- id: ui-brand-official
  disabled: true
# The right column is Rulith's execution view. dsh's own file browser and terminal act on dsh's workspace folder
# directly, outside Rulith, so they are not offered.
- id: ui-sidebar-files
  disabled: true
- id: ui-sidebar-terminal
  disabled: true
- id: terminal-controller
  disabled: true
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: agent-preset-registry
  config:
    default: rulith
- id: system-prompt
  config:
    includeRuntimeContext: false
    includeHarnessIdentity: false
    personaPrefix: ''
    personaSuffix: ''
- id: tools
  config:
    mode: native
- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: 1
# The model is not set here. The launcher keeps the route rulith-model (from Rulith's model settings) and, until the person
# picks another, the default model in the profile's own cordis.patch.yml: a patch replaces an entry's whole config and
# overlays come last, so setting llm-pi-ai here would erase providers added on dsh's Models page, and a `!!js` value here
# made every Models-page write fail validation.
- insert:
    - id: rulith-runtime
      name: ./rulith-runtime.mjs
      config:
        managerHome: !!js process.env.RULITH_DSH_MANAGER_HOME
        managerPort: !!js process.env.RULITH_DSH_MANAGER_PORT
        keyFile: !!js process.env.RULITH_DSH_KEY_FILE
        runtimeEntry: !!js process.env.RULITH_DSH_RUNTIME_ENTRY
        agentName: !!js process.env.RULITH_DSH_AGENT
        consoleUrl: !!js process.env.RULITH_DSH_CONSOLE_URL
        mcpUrl: !!js process.env.RULITH_DSH_MCP_URL
        shadow: !!js JSON.parse(process.env.RULITH_DSH_SHADOW || '{}')
        # 减负比例与 dsh 的压缩配置（见 context-relief.mjs）：由此算出每条模型路线实际的减负线；不经启动器时用默认值。
        # 表达式里有 `: `，不加引号 YAML 会把它读成映射。
        reliefRatio: !!js 'process.env.RULITH_DSH_RELIEF_RATIO ? Number(process.env.RULITH_DSH_RELIEF_RATIO) : undefined'
        compaction: !!js JSON.parse(process.env.RULITH_DSH_COMPACTION || '{}')
    - id: rulith-web-gate
      name: ./rulith-web-gate.mjs
      config:
        persona: !!js process.env.RULITH_DSH_PERSONA
    - id: rulith-dsh-ui
      name: rulith-dsh-ui
    # The only agent preset. dsh's stock presets carry their own shell, file, web and subagent tools at the agent layer,
    # which a global tool restriction does not reach, so they stay off. Its one agent-layer group is dsh's compaction
    # (所有者 2026-10-09：长会话需要它)：上下文到压缩线时把较早的一段对话压成摘要，最近约 16% 原样保留；上下文溢出时先压缩
    # 再重试；也可手动 /compact。摘要只是对话的回顾，不是证据：Board 上记下的才算，最新一份 Rulith 结果照样给出整个视图。
    # dsh 的结果裁剪器不挂：Rulith 结果由板视图转录安排。
    # 压缩线（2026-10-14）= compactionRatio × 窗口（默认 0.8，deep-rulith.json 可改），在减负线（reliefRatio，默认 0.7）之上：
    # 启动器把 thresholdRatio、headroomTokens（16384，使“窗口 − 输出上限 − headroom”不再先起作用）与摘要的输出上限
    # 以 RULITH_DSH_COMPACTION 传进来（见 context-relief.mjs）；不经启动器时为 dsh 的默认值。
    - id: preset-rulith
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rulith
        order: 0
        plugins:
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config: !!js JSON.parse(process.env.RULITH_DSH_COMPACTION || '{}')
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
